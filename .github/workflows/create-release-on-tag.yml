name: Create Release On Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Trigger artifact workflow for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-python-artifacts.yml --ref "${{ github.event.repository.default_branch }}" -f tag="${{ github.ref_name }}"
